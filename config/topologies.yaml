# PTT-INT: Topology Definitions

single_bottleneck:
  description: "Two switches, single bottleneck on s2 egress toward receiver"
  switches:
    s1:
      device_id: 0
      thrift_port: 9090
      switch_id: 1
    s2:
      device_id: 1
      thrift_port: 9091
      switch_id: 2
  hosts:
    h1:
      ip: "10.0.0.1/24"
      ns: "ptt_ns_h1"
      role: sender
    h2:
      ip: "10.0.0.2/24"
      ns: "ptt_ns_h2"
      role: receiver
  bottleneck:
    switch: s2
    port: 1
  links:
    - [h1, s1]
    - [s1, s2]
    - [s2, h2]

incast:
  description: "N senders → switch → switch → receiver, bottleneck on s2 egress"
  switches:
    s1:
      device_id: 0
      thrift_port: 9090
      switch_id: 1
    s2:
      device_id: 1
      thrift_port: 9091
      switch_id: 2
  hosts:
    sender_1: {ip: "10.0.0.11/24", ns: "ptt_ns_s1", role: sender}
    sender_2: {ip: "10.0.0.12/24", ns: "ptt_ns_s2", role: sender}
    sender_3: {ip: "10.0.0.13/24", ns: "ptt_ns_s3", role: sender}
    sender_4: {ip: "10.0.0.14/24", ns: "ptt_ns_s4", role: sender}
    receiver: {ip: "10.0.0.2/24", ns: "ptt_ns_h2", role: receiver}
  bottleneck:
    switch: s2
    port: 1
  n_senders: 4

leaf_spine:
  description: "2-leaf 2-spine with hosts on leaf switches"
  switches:
    leaf0: {device_id: 0, thrift_port: 9090, switch_id: 1}
    leaf1: {device_id: 1, thrift_port: 9091, switch_id: 2}
    spine0: {device_id: 2, thrift_port: 9092, switch_id: 3}
    spine1: {device_id: 3, thrift_port: 9093, switch_id: 4}
  hosts:
    h1: {ip: "10.0.0.1/24", ns: "ptt_ns_h1", role: sender}
    h2: {ip: "10.0.0.2/24", ns: "ptt_ns_h2", role: receiver}
  bottleneck:
    switch: leaf1
    port: 2
