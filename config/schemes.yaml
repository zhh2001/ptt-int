# PTT-INT: Telemetry Scheme Definitions
# Mode values must match P4 #define constants in ptt_int.p4

FULL:
  mode: 0
  description: "Full INT — every packet instrumented"
  sampling: "1/1"

PERIODIC_4:
  mode: 1
  description: "Periodic INT — instrument every 4th packet"
  sampling: "1/4"
  period_packets: 4

PERIODIC_16:
  mode: 2
  description: "Periodic INT — instrument every 16th packet"
  sampling: "1/16"
  period_packets: 16

PERIODIC_32:
  mode: 3
  description: "Periodic INT — instrument every 32nd packet"
  sampling: "1/32"
  period_packets: 32

REACTIVE:
  mode: 4
  description: "Reactive INT — burst on threshold (Q_EVENT), background 1/32"
  sampling: "reactive"
  background_sampling: "1/32"

DELTA:
  mode: 5
  description: "Delta-triggered INT — report when queue change >= threshold"
  sampling: "delta"
  delta_threshold_packets: 10
  background_sampling: "1/32"

PTT:
  mode: 6
  description: "PTT-INT — predictive FSM with EWMA trend, state-dependent sampling"
  sampling: "predictive"
  quiet_sampling: "1/32"
  watch_sampling: "1/4"
  burst_sampling: "1/1"

BYPASS:
  mode: 7
  description: "Diagnostic bypass — pure IPv4 forwarding, zero telemetry insertion"
  sampling: "none"
  note: "NOT a paper baseline; for TCP diagnosis and forwarding validation only"
