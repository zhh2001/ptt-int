# PTT-INT: Workload Definitions
# All workloads use fixed 1000-byte UDP payload

stable_60:
  type: stable
  description: "Stable 60% load — no congestion expected"
  load_ratio: 0.60
  duration_s: 30
  warmup_s: 2

stable_80:
  type: stable
  description: "Stable 80% load — below capacity"
  load_ratio: 0.80
  duration_s: 30
  warmup_s: 2

ramp_slow:
  type: ramp
  description: "Slow ramp 0.5→1.2C over 30s"
  start_load: 0.50
  end_load: 1.20
  duration_s: 30
  warmup_s: 2

ramp_medium:
  type: ramp
  description: "Medium ramp 0.5→1.5C over 30s"
  start_load: 0.50
  end_load: 1.50
  duration_s: 30
  warmup_s: 2

ramp_fast:
  type: ramp
  description: "Fast ramp 0.5→2.0C over 30s"
  start_load: 0.50
  end_load: 2.00
  duration_s: 30
  warmup_s: 2

step:
  type: step
  description: "Step change: 0.6C→1.3C at t=10s"
  load_before: 0.60
  load_after: 1.30
  switch_time_s: 10.0
  total_duration_s: 30
  warmup_s: 2

periodic_burst:
  type: periodic_burst
  description: "Periodic 2C bursts (100ms) every 1s on 0.6C background"
  burst_load: 2.0
  bg_load: 0.60
  burst_duration_ms: 100
  period_ms: 1000
  total_duration_s: 30
  warmup_s: 2

mixed:
  type: mixed
  description: "Mixed: stable→ramp→step→burst segments"
  total_duration_s: 40
  warmup_s: 2

# Microburst workloads for incast topology
microburst_2C_5ms:
  type: microburst
  description: "2C burst for 5ms on 0.7C background"
  intensity_C: 2.0
  bg_load_C: 0.70
  burst_duration_ms: 5
  total_duration_s: 10

